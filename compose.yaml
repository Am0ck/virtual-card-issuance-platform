services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: virtual_card
      POSTGRES_USER: virtual_card
      POSTGRES_PASSWORD: virtual_card
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtual_card -d virtual_card"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/virtual_card
      DB_USERNAME: virtual_card
      DB_PASSWORD: virtual_card
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
