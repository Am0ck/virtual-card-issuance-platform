spring.application.name=virtual-card-issuance-platform

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/virtual_card}
spring.datasource.username=${DB_USERNAME:virtual_card}
spring.datasource.password=${DB_PASSWORD:virtual_card}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
idempotency.retention-seconds=86400
idempotency.cleanup-interval-ms=3600000
card.expiration.lifetime=P365D
card.expiration.cleanup-interval-ms=60000

rate-limit.enabled=true
rate-limit.api.capacity=600
rate-limit.api.refill-tokens=600
rate-limit.api.refill-period=PT1M
rate-limit.health.capacity=300
rate-limit.health.refill-tokens=300
rate-limit.health.refill-period=PT1M
rate-limit.cache.maximum-size=10000
rate-limit.cache.expire-after-access=PT10M

management.endpoints.web.exposure.include=health,metrics
logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-}]
